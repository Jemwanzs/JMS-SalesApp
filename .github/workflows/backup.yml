name: Database Backup to Google Drive

# Hardening roadmap Phase 6.4 (docs/22-hardening-roadmap.md's "6.4
# advisory" section has the full design reasoning). Runs on GitHub's
# own infrastructure -- separate from both Vercel and Supabase, which
# is the whole point of a second, off-platform copy; Supabase's own
# backups/PITR remain the right tool for "restore to 10 minutes ago",
# this is the right tool for "Supabase itself became unreachable".
#
# Ticks every 6 hours, not on every push -- scripts/backup-to-drive.mjs
# itself decides whether a real backup is actually due (reads
# backup_frequency_hours from platform_settings, defaults to daily) and
# no-ops otherwise, the same "tick often, act conditionally" pattern
# run_business_day_sweep() already uses. workflow_dispatch is there for
# an on-demand manual run (initial setup verification, or an
# out-of-band backup before a risky change).
#
# Needs six repository secrets before this can do anything real --
# NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DB_URL,
# BACKUP_ENCRYPTION_PASSPHRASE, GOOGLE_SERVICE_ACCOUNT_KEY,
# BACKUP_DRIVE_FOLDER_ID -- see docs/22-hardening-roadmap.md's Phase
# 6.4 section for exactly how to obtain each one. Every run fails
# loudly (not silently) with a clear message identifying which secret
# is missing until all six are set.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PostgreSQL client (pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg

      - name: Install script dependencies (not the whole app)
        run: npm install --no-save --no-package-lock @supabase/supabase-js google-auth-library

      - name: Run backup
        run: node scripts/backup-to-drive.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          BACKUP_DRIVE_FOLDER_ID: ${{ secrets.BACKUP_DRIVE_FOLDER_ID }}
