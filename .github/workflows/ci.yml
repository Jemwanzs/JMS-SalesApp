name: CI

# Hardening roadmap Phase 2.7 (docs/22-hardening-roadmap.md): lint,
# typecheck, and build previously only ever ran manually/locally, never
# gated on push or PR. Uses GitHub, which this repo already has -- no
# new external account. Vercel's own git integration already handles
# preview/production deploys independently of this workflow; this
# exists purely as a fast, always-on correctness gate.
#
# Phase 5.2 added the Playwright step: smoke tests only, no Supabase
# backend involved (tests/e2e/smoke.spec.ts's own header comment has
# the full reasoning) -- they verify the build boots and the public,
# unauthenticated surface renders, using the exact same placeholder env
# vars as the Build step below. Real golden-path tests (sign up, log
# in, record a sale) would need a dedicated test Supabase project,
# which doesn't exist yet -- an explicit scope decision, not an
# oversight.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `LayoutProps`/`PageProps` etc. are Next.js-generated global types
      # that only exist once something has generated .next/types/ --
      # `next build` does this itself internally (which is why it always
      # succeeded here), but the standalone `tsc --noEmit` below has no
      # such step and fails on a truly fresh checkout with "Cannot find
      # name 'LayoutProps'" for app/layout.tsx's own LayoutProps<"/">
      # usage. `next typegen` generates just the types, without a full
      # build, so Type check can run standalone (and first, for fast
      # feedback) instead of needing Build to happen before it.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Non-secret placeholders: NEXT_PUBLIC_* values are safe to
          # expose by design (see lib/supabase/service-role.ts's own
          # allow-list comment), and CI only needs `next build` to
          # complete -- it never actually calls Supabase. Real values
          # live in Vercel's own environment config for the real
          # deployments this workflow doesn't replace.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_APP_URL: "https://placeholder.example.com"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_APP_URL: "https://placeholder.example.com"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
